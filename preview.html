<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Scene Creator AI Output Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #09090b;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-6">

  <!-- 1920x1080 Aspect Ratio Preview Container -->
  <div class="w-full max-w-[1280px] aspect-video bg-gray-900 rounded-2xl overflow-hidden shadow-2xl border border-gray-800 flex flex-col">
    
    <!-- Generated AI Scene Code -->
    <div class="h-full w-full bg-gray-900 flex flex-col">
      <div class="flex justify-between items-center py-4 px-6 bg-gray-800 border-b border-gray-700/60">
        <div class="flex items-center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8B9467" stroke-width="2">
            <path d="M3 11H5l7-7 7 7H5zM12 3C6.48 3 2 7.48 2 13s4.48 10 10 10 10-4.48 10-10S17.52 3 12 3zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" />
          </svg>
          <span class="ml-2 text-gray-300 font-semibold text-sm">Dashboard</span>
        </div>
        <div class="flex items-center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8B9467" stroke-width="2">
            <path d="M3 11H5l7-7 7 7H5zM12 3C6.48 3 2 7.48 2 13s4.48 10 10 10 10-4.48 10-10S17.52 3 12 3zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" />
          </svg>
          <span class="ml-2 text-gray-300 font-semibold text-sm">Settings</span>
        </div>
      </div>
      <div class="flex-1 p-8 bg-gray-900 flex flex-col justify-between">
        <div class="flex flex-col gap-6">
          <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <h1 class="text-3xl font-extrabold text-white">GuardRail Cloud Security Overview</h1>
            <div class="flex items-center gap-2">
              <span class="text-gray-400 text-sm font-medium">System Uptime:</span>
              <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 font-bold px-3 py-1 rounded-full text-xs">99.99%</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-6">
            <div class="bg-gray-800/80 border border-gray-700/60 rounded-xl p-6 shadow-xl">
              <h2 class="text-base font-bold text-gray-200 mb-4 flex items-center justify-between">
                Threat Detections (Last 24h)
                <span class="text-xs text-purple-400 font-mono">160 Total</span>
              </h2>
              <div class="flex flex-col gap-3">
                <div class="flex justify-between items-center bg-gray-900/60 px-3 py-2 rounded-lg text-sm">
                  <span class="text-gray-400 font-medium">SQLi</span>
                  <span class="text-rose-400 font-mono font-bold">120</span>
                </div>
                <div class="flex justify-between items-center bg-gray-900/60 px-3 py-2 rounded-lg text-sm">
                  <span class="text-gray-400 font-medium">XSS</span>
                  <span class="text-amber-400 font-mono font-bold">85</span>
                </div>
                <div class="flex justify-between items-center bg-gray-900/60 px-3 py-2 rounded-lg text-sm">
                  <span class="text-gray-400 font-medium">DDoS</span>
                  <span class="text-indigo-400 font-mono font-bold">40</span>
                </div>
                <div class="flex justify-between items-center bg-gray-900/60 px-3 py-2 rounded-lg text-sm">
                  <span class="text-gray-400 font-medium">Brute Force</span>
                  <span class="text-emerald-400 font-mono font-bold">15</span>
                </div>
              </div>
            </div>
            <div class="bg-gray-800/80 border border-gray-700/60 rounded-xl p-6 shadow-xl flex flex-col justify-between">
              <div>
                <h2 class="text-base font-bold text-gray-200 mb-2">Active Protection</h2>
                <p class="text-xs text-gray-400">Continuous cloud cluster security monitoring</p>
              </div>
              <div class="text-4xl font-extrabold text-indigo-400 font-mono">24/7</div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
